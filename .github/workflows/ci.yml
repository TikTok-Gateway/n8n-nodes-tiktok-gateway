name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global npm@11.19.0
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}` || p.private) throw new Error("Tag must match a publishable package version");'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Publish tested archive using npm Trusted Publishing
        run: npm publish ./release/*.tgz --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Tag must match package.json version");'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Publish tested archive to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.tgz > SHA256SUMS
          gh release create "$RELEASE_TAG" *.tgz SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
